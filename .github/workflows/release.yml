---
name: Release

# Drafts release notes on every push to main; builds, publishes the notes, and
# (when a PYPI_TOKEN secret is configured) uploads to PyPI on a version tag,
# which bump-my-version creates and pushes as v<major>.<minor>.<patch>.

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  draft:
    name: Update the draft release notes
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Update the draft
        uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    name: Build and publish ${{ github.ref_name }}
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/fluvial_particle/__init__.py').read_text()).group(1))")
          if [ "v$version" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match __version__ $version"
            exit 1
          fi

      - name: Build the sdist and wheel
        run: |
          pip install --constraint=.github/workflows/constraints.txt pip
          pip install build
          python -m build

      - name: Upload the distributions as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v6
        with:
          publish: true
          tag: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach the distributions to the release
        run: gh release upload "${{ github.ref_name }}" dist/* --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for a PyPI token
        id: pypi
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_TOKEN }}
        run: |
          if [ -n "$PYPI_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "PYPI_TOKEN is not set; skipping the PyPI upload"
          fi

      - name: Publish to PyPI
        if: steps.pypi.outputs.configured == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
